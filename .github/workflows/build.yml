name: Build SceneKraft

on:
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build SceneKraft
        run: |
          pyinstaller --onefile --windowed --name SceneKraft app.py

      - name: Rename EXE
        shell: pwsh
        run: |
          Rename-Item "dist/SceneKraft.exe" "SceneKraft-Windows-x64.exe"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SceneKraft-Windows-x64
          path: dist/SceneKraft-Windows-x64.exe

  macos:
    name: macOS
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt
          pip3 install pyinstaller

      - name: Build SceneKraft
        run: |
          pyinstaller --windowed --name SceneKraft app.py

      - name: Package macOS app
        run: |
          cd dist
          zip -r ../SceneKraft-macOS.zip SceneKraft.app

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: SceneKraft-macOS
          path: SceneKraft-macOS.zip
