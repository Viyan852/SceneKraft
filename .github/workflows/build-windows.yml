name: Build SceneKraft (Windows)

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # ------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      # ------------------------------------------------------
      # Clean old builds
      # ------------------------------------------------------

      - name: Clean build directories
        shell: cmd
        run: |
          if exist build rmdir /s /q build
          if exist dist rmdir /s /q dist

      # ------------------------------------------------------
      # Build EXE
      # ------------------------------------------------------

      - name: Build executable
        run: |
          python -m PyInstaller --clean --noconfirm SceneKraft.spec

      # ------------------------------------------------------
      # Verify
      # ------------------------------------------------------

      - name: Verify executable
        shell: powershell
        run: |
          if (!(Test-Path "dist\SceneKraft.exe")) {
            Write-Error "SceneKraft.exe was not created."
            exit 1
          }

          Write-Host "Build successful:"
          Get-Item "dist\SceneKraft.exe" | Format-List Name,Length,FullName

      # ------------------------------------------------------
      # ZIP
      # ------------------------------------------------------

      - name: Create ZIP archive
        shell: powershell
        run: |
          Compress-Archive `
            -Path "dist\SceneKraft.exe" `
            -DestinationPath "dist\SceneKraft-Windows.zip" `
            -Force

      # ------------------------------------------------------
      # GitHub Actions artifact
      # ------------------------------------------------------

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SceneKraft-Windows
          path: dist/SceneKraft-Windows.zip
          if-no-files-found: error

      # ------------------------------------------------------
      # GitHub Release
      # ------------------------------------------------------

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SceneKraft-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
