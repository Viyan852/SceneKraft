name: Build SceneKraft (macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build macOS app
        run: |
          pyinstaller --clean --noconfirm \
            --name SceneKraft \
            --onedir \
            --windowed \
            --icon=favicon.ico \
            app.py

      - name: Verify app
        run: |
          if [ ! -d "dist/SceneKraft.app" ]; then
            echo "SceneKraft.app was not created."
            exit 1
          fi
          echo "Build successful"
          ls -lah dist/SceneKraft.app

      - name: Create DMG
        run: |
          mkdir -p dist_dmg
          cp -R dist/SceneKraft.app dist_dmg/
          hdiutil create \
            -volname "SceneKraft" \
            -srcfolder dist_dmg \
            -ov \
            -format UDZO \
            dist/SceneKraft-macOS.dmg

      - name: Verify DMG
        run: |
          if [ ! -f "dist/SceneKraft-macOS.dmg" ]; then
            echo "SceneKraft-macOS.dmg was not created."
            exit 1
          fi
          ls -lh dist/SceneKraft-macOS.dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SceneKraft-macOS
          path: dist/SceneKraft-macOS.dmg
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SceneKraft-macOS.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
