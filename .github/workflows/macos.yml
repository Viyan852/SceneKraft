name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build App
        run: |
          pyinstaller --onedir --windowed --icon=favicon.ico app.py
      
      - name: Create DMG
        run: |
          mkdir -p dist_dmg
          cp -R dist/SceneKraft.app dist_dmg/
          hdiutil create -volname "SceneKraft" -srcfolder dist_dmg -ov -format UDZO dist/SceneKraft-macOS.dmg
      
      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/SceneKraft-macOS.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
